<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us </title>
    <style>
        
        nav ul { display: flex; list-style: none; gap: 20px; background: #eee; padding: 10px; }
        footer { background: #333; color: #fff; padding: 20px; text-align: center; }
    </style>
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        
    </header>

    <main>
       <section>
            <h1>Get in Touch</h1>
            <p>Please fill out the form below to reach us.</p>

            <form action="#" method="post">
                <fieldset>
                    <legend>Contact Information</legend>

                    <div>
                        <label for="email">Email Address:</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            required 
                            pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
                            title="Please enter a valid email"
                            placeholder="enter email">
                    </div>

                    <div>
                        <label for="phone">Phone Number:</label>
                        <input 
                            type="tel" 
                            id="phone" 
                            name="phone" 
                            required 
                            pattern="[0-9]{11}" 
                            title="Phone number must be exactly 11 digits"
                            placeholder="enter number">
                    </div>

                    <div>
                        <label for="message">Message Details:</label>
                        <textarea id="message" name="message" rows="4" required placeholder="How can we help you?"></textarea>
                    </div>

                    <button type="submit">Send Message</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Adel. All rights reserved.</p>
    </footer>
</body>
</html>
