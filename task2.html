<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grades Table</title>

    <style>
        th, td 
        {
            border: 1px solid #333; 
            padding: 5px; 
            text-align: center;
        }

        thead
        {
            background-color: red;
        }


    </style>

</head>
<body>

    <table>
        <caption>Student Grades Results</caption>
        <thead>
            <tr>
                <th>Name</th>
                <th>Math</th>
                <th>Science</th>
                <th>English</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>Adel</th>
                <td>95</td>
                <td>88</td>
                <td>92</td>
            </tr>
            <tr>
                <th>Ahmed</th>
                <td>90</td>
                <td>85</td>
                <td>81</td>
            </tr>
            <tr>
                <th>Youssef</th>
                <td>90</td>
                <td>91</td>
                <td>85</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
